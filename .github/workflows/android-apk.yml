# Builds the Android app (an installable APK) on GitHub's free runners and attaches it to a release.
# Download on the phone: https://github.com/<owner>/<repo>/releases/latest/download/WakeWord.apk
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages (also rebuilds icons and alarm sound)
        run: npm ci

      - name: Check the learning logic
        run: npm test

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          EXPO_OFFLINE: 1

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs=-Xmx4g

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk WakeWord.apk
          tag="build-${{ github.run_number }}"
          gh release create "$tag" WakeWord.apk \
            --title "Wake Word build ${{ github.run_number }}" \
            --notes "Open this page on your Android phone and tap WakeWord.apk to install." \
            --latest
